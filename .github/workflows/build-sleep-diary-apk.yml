name: Build sleep diary APK
on:
  workflow_dispatch:
  push:
    branches: [claude/sleep-tracking-sensor-eval-x97b9n]
    paths: ['android/**', 'sleep-diary/**', '.github/workflows/build-sleep-diary-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Test flip logic
        run: node sleep-diary/test/flip.test.js
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sleep-diary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to the branch
        run: |
          mkdir -p apk && cp android/app/build/outputs/apk/debug/app-debug.apk apk/sleep-diary-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/sleep-diary-debug.apk
          git diff --cached --quiet || (git commit -m "CI: update debug APK" && git push)
