<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>睡眠日記</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1b2437; --sub:#6b7488; --pri:#2f4a8a; --line:#dde2ee; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; height:100dvh; font:16px/1.4 system-ui,-apple-system,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
  header { flex:0 0 36px; background:#14213d; color:#fff; font-weight:600; display:flex; align-items:center; padding:0 14px; }
  main { flex:1; min-height:0; overflow-y:auto; padding:8px 10px; max-width:720px; width:100%; margin:0 auto; }
  body.hasTimer main { padding-bottom:52px; }
  nav { flex:0 0 52px; display:flex; background:#fff; border-top:1px solid var(--line); z-index:5; }
  nav button { flex:1; border:0; background:none; font-size:12px; color:var(--sub); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  nav button .i { font-size:20px; line-height:1; }
  nav button.on { color:var(--pri); font-weight:700; box-shadow:inset 0 3px var(--pri); }
  input,select,textarea { width:100%; font:inherit; padding:9px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  label { display:block; margin:10px 0 2px; font-size:14px; color:var(--sub); }
  h2 { font-size:17px; margin:0 0 6px; }
  .btn { display:block; width:100%; border:0; border-radius:12px; padding:13px; font-size:16px; font-weight:600; background:var(--pri); color:#fff; margin-top:10px; }
  .btn.alt { background:#e8ecf7; color:var(--pri); } .btn.danger { background:#7a2b2b; }
  .hint { font-size:13px; color:var(--sub); }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px; }
  .sec { display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:600; margin:2px 2px 0; } .sec small { font-weight:400; color:var(--sub); font-size:12px; }
  .tb small { font-size:11px; color:var(--sub); } .tb.run small { color:#f3d0d0; } .big small { display:block; font-size:12px; font-weight:400; color:#aab; margin-top:4px; }
  .stl { text-align:center; font-size:15px; color:var(--sub); margin:0 0 2px; min-height:22px; } .stl b { color:#1565c0; font-size:17px; }
  .dt { flex:1; min-width:0; position:relative; height:38px; border:1px solid var(--line); border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; white-space:nowrap; } .dt input { position:absolute; inset:0; width:100%; height:100%; opacity:0; padding:0; }
  .cat { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; } .cat button { border:2px solid; border-radius:12px; padding:6px 0 4px; font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:1px; min-height:62px; justify-content:center; } .cat button span { font-size:23px; line-height:1.1; } .cat button small { font-size:9px; font-weight:400; }
  .mini { margin:8px 0 0; } .mc { background:#fff; border:1px solid var(--line); border-radius:12px; padding:7px 2px; text-align:center; } .mc small { display:block; font-size:12px; color:var(--sub); } .mc b { font-size:17px; }
  .leg { display:flex; justify-content:center; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--sub); margin-top:8px; } .leg i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .srow { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:10px; } .srow .btn { margin-top:0; } .srow p { margin:6px 2px 0; font-size:13px; color:var(--sub); }
  .rec { display:flex; flex-direction:column; gap:8px; height:100%; } .rec .g3 { margin:0; grid-auto-rows:1fr; } .rec .g3.t { flex:4; } .rec .g3.e { flex:2; } .rec .nightrow { flex:3; }
  .tb { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 2px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:13px; color:var(--ink); min-height:76px; justify-content:center; }
  .tb .i { font-size:27px; line-height:1.1; }
  .tb.run { background:#7a2b2b; color:#fff; border-color:#7a2b2b; }
  .tb.ev { min-height:60px; flex-direction:row; justify-content:center; gap:6px; }
  .nightrow { display:grid; grid-template-columns:1fr 2fr; gap:8px; }
  .big { background:#14213d; color:#fff; border:0; border-radius:14px; font-size:20px; font-weight:700; min-height:92px; }
  .bar { display:flex; gap:6px; align-items:center; margin-bottom:8px; }
  .bar input[type=date] { flex:1; min-width:0; padding:7px; }
  .ib { flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:10px; min-width:38px; height:38px; font-size:17px; padding:0 8px; color:var(--ink); }
  .ib.t { font-size:13px; font-weight:600; color:var(--pri); }
  .brush { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px; }
  .brush button { border:2px solid var(--line); background:#fff; border-radius:10px; height:40px; font-size:20px; padding:0; }
  .brush button.on { border-color:var(--pri); background:#e8ecf7; }
  .clock { width:min(100%,52vh); display:block; margin:0 auto; touch-action:manipulation; }
  .wk { width:100%; max-height:44vh; display:block; }
  .stats { display:flex; justify-content:space-around; background:#fff; border-radius:12px; padding:8px 2px; margin-top:8px; font-size:15px; font-weight:600; text-align:center; } .stats small { display:block; font-size:11px; font-weight:400; color:var(--sub); }
  .stars { display:flex; gap:6px; } .stars button { flex:1; padding:6px 0; border:2px solid var(--line); border-radius:10px; background:#fff; font-size:22px; line-height:1.2; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .chips button { border:1px solid var(--line); background:#f4f6fb; border-radius:99px; padding:4px 12px; font-size:13px; }
  details > summary { cursor:pointer; font-weight:600; color:var(--pri); margin-top:10px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:15px; } .kv b { text-align:right; }
  .lg { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:14px; } .lg i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  /* 彈出面板 */
  #sheet { position:fixed; inset:0; z-index:15; display:none; } #sheet.show { display:block; }
  #sheet .back { position:absolute; inset:0; background:#0006; }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto; background:#fff; border-radius:16px 16px 0 0; padding:16px 16px 20px; max-width:720px; margin:0 auto; }
  .intro { text-align:center; } .intro .big-i { font-size:54px; line-height:1.2; } .intro p { margin:6px 0; font-size:16px; }
  .dots { display:flex; justify-content:center; gap:6px; margin:10px 0 0; } .dots i { width:8px; height:8px; border-radius:50%; background:#cfd5e6; } .dots i.on { background:var(--pri); }
  .row2 { display:grid; grid-template-columns:1fr 2fr; gap:8px; } .row2 .btn { margin-top:12px; }
  /* 常駐計時列、提示 */
  #timerbar { position:fixed; left:0; right:0; bottom:52px; z-index:6; display:none; background:#14213d; color:#fff; font-size:14px; }
  #timerbar .tbr { display:flex; justify-content:space-between; align-items:center; padding:7px 12px; border-top:1px solid #2c3a5e; }
  #timerbar button { background:#e03e3e; color:#fff; border:0; border-radius:8px; padding:6px 16px; font-size:14px; font-weight:600; }
  #toast { position:fixed; left:50%; transform:translateX(-50%); top:48px; background:#000c; color:#fff; padding:9px 16px; border-radius:99px; z-index:30; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center; }
  #toast.show { opacity:1; }
  /* 夜間模式:純黑 */
  #night { position:fixed; inset:0; background:#000; color:#333; z-index:20; display:none; flex-direction:column; justify-content:space-between; align-items:center; padding:28px 18px; text-align:center; }
  #night.show { display:flex; }
  #night .st { font-size:15px; margin-top:40px; } #night .st b { color:#444; font-size:26px; display:block; margin-bottom:6px; }
  #night .ctl { width:100%; display:flex; flex-direction:column; gap:10px; }
  #night button { background:#0d0d0d; color:#3a3a3a; border:1px solid #1a1a1a; border-radius:10px; padding:16px; font-size:16px; }
  @media print { header,nav,.noprint,#timerbar { display:none !important; } body { display:block; height:auto; background:#fff; } main { overflow:visible; } }
</style>
</head>
<body>
<header>🌙 睡眠日記</header>
<main id="app"></main>
<nav>
  <button data-tab="night"><span class="i">⏱</span>記錄</button>
  <button data-tab="diary"><span class="i">🕐</span>日記</button>
  <button data-tab="week"><span class="i">📊</span>一週</button>
  <button data-tab="data"><span class="i">⚙️</span>設定</button>
</nav>
<div id="night"></div>
<div id="sheet"></div>
<script src="flip.js"></script>
<script src="timeline.js"></script>
<script src="app.js"></script>
</body>
</html>
